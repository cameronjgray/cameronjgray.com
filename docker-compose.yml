# --------------------------------------------------------------------
# CV site - hardened container.
#
# Binds only to 127.0.0.1 on the host. ngrok (running on the host)
# forwards public traffic to it. Nothing on your LAN or the internet
# reaches the container directly.
# --------------------------------------------------------------------

services:
  web:
    build: .
    image: cameronjgray.com:latest
    container_name: cameronjgray.com
    restart: unless-stopped

    ports:
      # - "127.0.0.1:$PORT:8080"
      - "$PORT:8080"

    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://localhost:$PORT/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    driver: bridge
